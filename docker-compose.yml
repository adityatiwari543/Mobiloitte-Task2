version: '3.8'

services:
  jobconnect-mongodb:
    image: mongo:8.0
    container_name: jobconnect-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - jobconnect-net

  jobconnect-redis:
    image: redis:7.4-alpine
    container_name: jobconnect-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - jobconnect-net

  jobconnect-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jobconnect-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI:-mongodb://jobconnect-mongodb:27017/jobconnect}
      - REDIS_URL=${REDIS_URL:-redis://jobconnect-redis:6379}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-deterministic}
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      - jobconnect-mongodb
      - jobconnect-redis
    networks:
      - jobconnect-net

  jobconnect-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jobconnect-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - jobconnect-backend
    networks:
      - jobconnect-net

volumes:
  mongo_data:
  redis_data:

networks:
  jobconnect-net:
    driver: bridge
